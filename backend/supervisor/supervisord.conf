[supervisord]
nodaemon=true ; Jalankan Supervisor di foreground

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" ; Perintah untuk menjalankan Nginx di foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
; Perintah untuk menjalankan PHP-FPM di foreground.
; Ini akan menggunakan konfigurasi default yang sudah ada di image PHP-FPM.
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
