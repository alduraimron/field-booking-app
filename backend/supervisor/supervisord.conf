[supervisord]
nodaemon=true ; Jalankan Supervisor di foreground

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" ; Perintah untuk menjalankan Nginx di foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf ; Perintah untuk menjalankan PHP-FPM di foreground
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
