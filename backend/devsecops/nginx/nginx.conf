server {
    listen 80;
    server_name _; # Menanggapi semua nama host

    # Direktori root untuk Laravel (ini adalah tempat Laravel di-mount di Pod)
    root /var/www/html/public; # Laravel public directory

    index index.php index.html index.htm;

    # Mengizinkan CORS
    add_header 'Access-Control-Allow-Origin' '*'; # Sesuaikan dengan origin frontend Anda
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Penanganan PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        # Mengarahkan permintaan PHP ke PHP-FPM.
        # '127.0.0.1:9000' atau 'php-fpm:9000' (jika di Pod yang sama dan ada hostname)
        # Di sini, karena dalam Pod yang sama, kita bisa pakai localhost:9000
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Penanganan URL yang rapi (Laravel rewrite rules)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Menghindari akses ke file tersembunyi seperti .env
    location ~ /\. {
        deny all;
    }
}
