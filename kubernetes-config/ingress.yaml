apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  annotations:
    # Hapus anotasi rewrite-target GLOBAL ini karena Laravel Anda mengharapkan /api/
    # nginx.ingress.kubernetes.io/rewrite-target: / 
spec:
  rules:
  - host: myapp.local
    http:
      paths:
      - path: /api/ # Cocokkan prefix /api/
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      - path: / # Untuk frontend
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80