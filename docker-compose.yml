version: "3.8"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mydb
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    image: your_dockerhub_username/my-backend:latest
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mydb
      DB_USERNAME: root
      DB_PASSWORD: secret
    ports:
      - "9000:9000"
    volumes:
      - ./backend/storage:/var/www/storage
    command: >
      sh -c "php artisan migrate --force && php-fpm"

  frontend:
    image: your_dockerhub_username/my-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  dbdata:
